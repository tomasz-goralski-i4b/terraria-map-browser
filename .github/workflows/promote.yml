name: promote
# Deterministic backlog "manager": when an issue closes (PR merged with "Closes #N")
# it unblocks the next issues (backlog → agent:ready). A Cezar automation picks them up from there.
on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be promoted"
        type: boolean
        default: false

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backlog/promote.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_ACTIVE: "2"
