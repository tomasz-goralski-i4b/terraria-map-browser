name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  cwm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > "$RUNNER_TEMP/lfs-ids"
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles(format('{0}/lfs-ids', runner.temp)) }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: dotnet/**/packages.lock.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/compatibility/cwm.test.mjs
      - name: Build independent exporters
        run: |
          dotnet restore dotnet/Terraria.WorldInspector --locked-mode
          dotnet build dotnet/Terraria.WorldInspector --no-restore -warnaserror
          pnpm -s typecheck
      - name: Compare every manifest fixture
        run: node scripts/compatibility/cwm.mjs
      - name: Upload mismatch reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cwm-mismatch-reports
          path: .tdd/cwm-*/report.txt
          include-hidden-files: true
          if-no-files-found: ignore
  # Runs in parallel with cwm-compatibility: a `needs` dependency would add that job's time to every CI run.
  # The two halves of verify.sh (STUDIO_VERIFY_PART, scripts/lib.sh) run on separate runners, so neither shares a VM
  # with the other; together they are the whole check.
  verify:
    strategy:
      fail-fast: false
      matrix:
        part: [dotnet, web]
    name: verify (${{ matrix.part }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # World fixtures live in Git LFS. Restore them from the Actions cache keyed on the LFS object ids, so a CI
      # run normally downloads nothing from LFS (GitHub meters LFS bandwidth); pull only what is missing.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > "$RUNNER_TEMP/lfs-ids"
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles(format('{0}/lfs-ids', runner.temp)) }}
          restore-keys: lfs-
      - run: git lfs pull
      - if: matrix.part == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # NuGet cache keyed on the committed lock files; scripts/build.sh restores
          # with --locked-mode because GitHub Actions sets CI=true.
          cache: true
          cache-dependency-path: dotnet/**/packages.lock.json
      # pnpm version comes from package.json "packageManager"; v6+ is required for pnpm 11.
      - if: matrix.part == 'web'
        uses: pnpm/action-setup@v6
      # Same Node major as local development: .node-version (and package.json "engines").
      - if: matrix.part == 'web'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: matrix.part == 'web'
        run: pnpm install --frozen-lockfile
      # Browser tests run headless, so they need only Chromium's headless shell. Cache it per Playwright version;
      # on a hit, skip the install: the runner image already has the system libraries Chromium needs.
      - name: Playwright version
        if: matrix.part == 'web'
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: matrix.part == 'web'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: matrix.part == 'web' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # The same command the Cezar chain gates run — a single definition of "green". CI skips the Vitest tests tagged
      # `perf` (they starve on shared runners); the agents' local verify.sh runs everything.
      - run: bash scripts/verify.sh
        env:
          STUDIO_VERIFY_PART: ${{ matrix.part }}
          STUDIO_SKIP_PERF: "1"
