name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # NuGet cache keyed on the committed lock files; scripts/build.sh restores
          # with --locked-mode because GitHub Actions sets CI=true.
          cache: true
          cache-dependency-path: dotnet/**/packages.lock.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same command the Cezar chain gates run — a single definition of "green".
      - run: bash scripts/verify.sh
