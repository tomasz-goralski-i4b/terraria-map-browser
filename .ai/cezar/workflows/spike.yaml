name: spike
description: "Research (e.g. the .wld format): notes in docs/ and fixtures, no production code. Ends with verify.sh and a draft PR."
steps:
  - id: research
    name: Research
    skill: spike
    prompt: "{{task}}"
    runner: claude
  - id: verify
    name: Gate — verify.sh
    command: "bash scripts/tdd/check-verify.sh"
    onFail: { retry: research, max: 1, retryOn: [1] }

  - id: open-pr
    name: Draft PR + status:pr-ready
    command: "bash scripts/tdd/open-pr.sh"
