name: spike
description: "Rozpoznanie (np. format .wld): notatki w docs/ i fixture'y, bez kodu produkcyjnego. Kończy się verify.sh."
steps:
  - id: research
    name: Research
    skill: spike
    prompt: "{{task}}"
    runner: claude
  - id: verify
    name: Gate — verify.sh
    command: "bash scripts/tdd/check-verify.sh"
    onFail: { retry: research, max: 1, retryOn: [1] }

  - id: open-pr
    name: Draft PR + status:pr-ready
    command: "bash scripts/tdd/open-pr.sh"
