name: foundation
description: "No TDD — infrastructure, CI, docs, scaffolding. Implement → verify.sh → cross-review → draft PR."
steps:
  - id: implement
    name: Implement
    skill: foundation
    prompt: "{{task}}"
    runner: claude
  - id: verify
    name: Gate — verify.sh
    command: "bash scripts/tdd/check-verify.sh"
    onFail: { retry: implement, max: 2, retryOn: [1] }
  - id: review
    name: Cross-review (Codex, report only)
    skill: reviewer
    prompt: "{{task}}"
    runner: codex
  - id: check-review
    name: Gate — reviewer verdict
    command: "bash scripts/tdd/check-review.sh"
    onFail: { retry: implement, max: 2, retryOn: [1] }

  - id: open-pr
    name: Draft PR + status:pr-ready
    command: "bash scripts/tdd/open-pr.sh"
