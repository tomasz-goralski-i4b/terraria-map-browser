name: tdd-feature
description: "TDD: Claude implements (red → green → refactor), Codex reviews. Every gate is a script in scripts/tdd."
steps:
  - id: red
    name: Red — tests and stubs
    skill: tdd-red
    prompt: "{{task}}"
    runner: claude
  - id: check-red
    name: Gate — tests fail
    command: "bash scripts/tdd/check-red.sh"
    onFail: { retry: red, max: 2, retryOn: [1] }

  - id: green
    name: Green — minimal implementation
    skill: tdd-green
    prompt: "{{task}}"
    runner: claude
  - id: check-green
    name: Gate — verify.sh, tests untouched
    command: "bash scripts/tdd/check-green.sh"
    onFail: { retry: green, max: 3, retryOn: [1] }

  - id: refactor
    name: Refactor
    skill: tdd-refactor
    prompt: "{{task}}"
    runner: claude
  - id: check-refactor
    name: Gate — verify.sh after refactor
    command: "bash scripts/tdd/check-green.sh"
    onFail: { retry: refactor, max: 1, retryOn: [1] }

  - id: review
    name: Cross-review (Codex, report only)
    skill: reviewer
    prompt: "{{task}}"
    runner: codex
  - id: check-review
    name: Gate — reviewer verdict
    command: "bash scripts/tdd/check-review.sh"
    onFail: { retry: red, max: 2, retryOn: [1] }

  - id: open-pr
    name: Draft PR + status:pr-ready
    command: "bash scripts/tdd/open-pr.sh"

  - id: merge-ready
    name: Gate — APPROVE + green CI → ready to merge
    command: "bash scripts/tdd/merge-ready.sh"
