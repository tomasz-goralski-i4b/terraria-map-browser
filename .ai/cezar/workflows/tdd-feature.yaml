name: tdd-feature
description: "TDD: Claude implementuje (red → green → refactor), Codex reviewuje. Bramki to skrypty w scripts/tdd."
steps:
  - id: red
    name: Red — testy i stuby
    skill: tdd-red
    prompt: "{{task}}"
    runner: claude
  - id: check-red
    name: Gate — testy failują
    command: "bash scripts/tdd/check-red.sh"
    onFail: { retry: red, max: 2, retryOn: [1] }

  - id: green
    name: Green — minimalna implementacja
    skill: tdd-green
    prompt: "{{task}}"
    runner: claude
  - id: check-green
    name: Gate — verify.sh, testy nietknięte
    command: "bash scripts/tdd/check-green.sh"
    onFail: { retry: green, max: 3, retryOn: [1] }

  - id: refactor
    name: Refactor
    skill: tdd-refactor
    prompt: "{{task}}"
    runner: claude
  - id: check-refactor
    name: Gate — verify.sh po refaktorze
    command: "bash scripts/tdd/check-green.sh"
    onFail: { retry: refactor, max: 1, retryOn: [1] }

  - id: review
    name: Cross-review (Codex, tylko raport)
    skill: reviewer
    prompt: "{{task}}"
    runner: codex
  - id: check-review
    name: Gate — werdykt reviewera
    command: "bash scripts/tdd/check-review.sh"
    onFail: { retry: red, max: 2, retryOn: [1] }
