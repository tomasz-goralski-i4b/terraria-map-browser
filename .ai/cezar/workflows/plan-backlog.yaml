name: plan-backlog
description: "Planner: splits a milestone into small issues with dependencies (.tdd/backlog.json); a script validates it and creates the issues on GitHub with the backlog label. Runs on the runner picked for the task."
steps:
  - id: plan
    name: Plan the backlog
    skill: backlog-planner
    prompt: "{{task}}"
  - id: create-issues
    name: Gate — validate + gh issue create
    command: "bash scripts/backlog/create-issues.sh"
    onFail: { retry: plan, max: 2, retryOn: [1] }
